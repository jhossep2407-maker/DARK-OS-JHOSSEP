# ==========================================
# DARK OS Configuration
# ==========================================

[app]
name = "DARK OS"
version = "1.0.0"
environment = "development"
debug = true

# ==========================================

[ai]
provider = "gemini"
model = "gemini-2.5-flash"
temperature = 0.7
top_p = 1.0
max_tokens = 2048

# ==========================================

[database]
sqlite_path = "data/database/dark.db"
vector_db_path = "data/vectors"
backup_path = "data/backups"

# ==========================================

[memory]
short_memory_limit = 25
long_memory_limit = 5000
summary_trigger = 40
vector_search_limit = 8
auto_save = true
auto_summarize = true

# ==========================================

[voice]
provider = "gemini"
language = "es"
voice = "onyx"
speed = 1.0
wake_word = "Oye Dark"

# ==========================================

[vision]
enabled = false

# ==========================================

[dashboard]
host = "127.0.0.1"
port = 8000

# ==========================================

[plugins]
enabled = true
folder = "app/plugins"

# ==========================================

[security]
encryption = true
key_path = "data/security/secret.key"

# ==========================================

[logging]
level = "INFO"